syntax = "proto3";

service SensorService {
  rpc SendData (SensorData) returns (Ack);
}

message SensorData {
  double temperature = 1;
  double humidity = 2;
  double current = 3;
  double timestamp = 4;
  string padding = 5;  // Optional field for payload size testing
  int32 payload_size_before = 6;  // Size before serialization (original JSON size)
}

message Ack {
  string status = 1;
}